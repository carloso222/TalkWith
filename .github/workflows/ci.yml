name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Las pruebas unitarias se activan solas cuando exista el script "test".
      - run: npm test --if-present

  reglas:
    name: Pruebas de reglas (emulador)
    runs-on: ubuntu-latest
    # Solo corre cuando el repo ya tiene reglas de Firestore (TW 04).
    if: ${{ hashFiles('firestore.rules') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # El emulador de Firestore necesita Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:reglas --if-present
